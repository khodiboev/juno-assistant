services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: juno-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    restart: unless-stopped

  api:
    build: .
    container_name: juno-api
    depends_on:
      - qdrant
    environment:
      - QDRANT_URL=http://qdrant:6333
      - LLM_BACKEND=llama_cpp
      - LLM_THREADS=2
      - CORS_ORIGINS=["https://ask.santacar.tech","http://ask.santacar.tech"]
    volumes:
      - models:/models
      - ./knowledge:/app/knowledge:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: juno-web
    depends_on:
      - api
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

volumes:
  qdrant_data:
  models:
